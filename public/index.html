<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Device List</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background-color: #f4f4f9;
        }
        h1 {
            text-align: center;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin: 20px 0;
        }
        table, th, td {
            border: 1px solid #ddd;
        }
        th, td {
            padding: 8px;
            text-align: left;
            color: #000000;
        }
        th {
            background-color: #00000000;
        }
        .loading {
            text-align: center;
            color: #555;
        }
        footer {
          text-align: center;
          padding: 10px;
          background: linear-gradient(to right, #ff9f0f, #fd6f10);
          width: 100%;
          position: fixed;
          bottom: 0;
          left: 0;
        }
        footer a {
            color: white;
            text-decoration: none;
            font-weight: bold;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        footer a:hover {
            text-decoration: underline;
        }
        footer img {
            height: 20px;
            vertical-align: middle;
        }
    </style>
</head>
<body>

    <h1>Device List</h1>
    <div id="loading" class="loading">Loading devices...</div>
    <table id="deviceTable" style="display: none;">
        <thead>
            <tr>
                <th>Name</th>
                <th>ID</th>
                <th>Address</th>
                <th>Last Seen</th>
                <th>Tags</th>
            </tr>
        </thead>
        <tbody id="deviceTableBody">
            <!-- Devices will be dynamically added here -->
        </tbody>
    </table>

    <footer>
      <p><a href="https://github.com/bitcrushtesting/whereisit" target="_blank" id="brand-link">
        <span id="brand-name">WHEREISIT</span>
      </a></p>
    </footer>

    <script>
      let apiBaseUrl = '';

      async function fetchBranding() {
          try {
              const response = await fetch('/branding');
              if (!response.ok) return;
              const branding = await response.json();

              if (branding.name) {
                  document.title = branding.name;
                  document.getElementById('brand-name').textContent = branding.name;
              }

              if (branding.link) {
                  document.getElementById('brand-link').href = branding.link;
              }

              if (branding.logo) {
                  const favicon = document.createElement('link');
                  favicon.rel = 'icon';
                  favicon.href = branding.logo;
                  document.head.appendChild(favicon);

                  const img = document.createElement('img');
                  img.src = branding.logo;
                  img.alt = '';
                  const link = document.getElementById('brand-link');
                  link.insertBefore(img, link.firstChild);
              }

              if (branding.apiUrl) {
                  apiBaseUrl = branding.apiUrl.replace(/\/$/, '');
              }
          } catch (error) {
              console.error('Error fetching branding:', error);
          }
      }

      async function fetchDevices() {
          try {
              const response = await fetch(apiBaseUrl + '/api/devices', {
                  method: 'GET',
                  headers: {
                      'X-API-Key': 'your_api_key',
                      'Content-Type': 'application/json'
                  }
              });

              if (!response.ok) {
                  throw new Error('Network response was not ok');
              }
              const devices = await response.json();
              displayDevices(devices);
          } catch (error) {
              document.getElementById('loading').innerText = 'Failed to load devices.';
              console.error('Error fetching devices:', error);
          }
      }

      function displayDevices(devices) {
          const tableBody = document.getElementById('deviceTableBody');
          tableBody.innerHTML = '';

          devices.forEach(device => {
              const row = document.createElement('tr');

              const idCell = document.createElement('td');
              idCell.textContent = device.name;
              row.appendChild(idCell);

              const nameCell = document.createElement('td');
              nameCell.textContent = device.id;
              row.appendChild(nameCell);

              const typeCell = document.createElement('td');
              typeCell.textContent = device.address;
              row.appendChild(typeCell);

              const statusCell = document.createElement('td');
              statusCell.textContent = device.added;
              row.appendChild(statusCell);

              tableBody.appendChild(row);
          });

          document.getElementById('loading').style.display = 'none';
          document.getElementById('deviceTable').style.display = 'table';
      }

      document.addEventListener('DOMContentLoaded', async () => {
          await fetchBranding();
          fetchDevices();
      });
    </script>
</body>
</html>
